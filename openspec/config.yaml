schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Domain: Bible arcing/bracketing, the discourse-analysis method developed by
  Daniel Fuller and popularized by John Piper and Thomas Schreiner. The
  product combines Greek reading, grammatical diagramming and discourse
  analysis. Pricing, open-source status and the product name are undecided.

  Two data models, kept strictly separate — never conflate them in a spec:
  - Discourse analysis (arcing/bracketing): propositions (clauses) linked by
    the canonical 18 logical relationships (+4 extended), rendered as arcs or
    brackets — one model, two view layers, not two features.
  - Grammatical/sentence diagramming: word-level syntax (Reed-Kellogg style),
    uses MACULA morphology. In scope for the product; its editor is a separate
    change. See PRODUCT.md and docs/reference/model-notes.md.

  Source text: SBL Greek New Testament (SBLGNT), CC BY 4.0. Greek only for
  v1; Hebrew is deferred as a scope choice. MACULA Greek supplies morphology
  and syntax under CC BY 4.0. Bundling SBLGNT requires retaining its copyright notice, license
  link, CC BY 4.0 statement, and a note of any modifications — both in-repo
  and in the shipped UI.

  Target tech stack (app-server-and-sqlite supersedes the static-export and
  IndexedDB plans; inspect the current branch before assuming it is applied):
  Next.js App Router + React + TypeScript on Node 26, with standalone Node
  server output. SQLite through Drizzle ORM and better-sqlite3, migrations
  through drizzle-kit. Separate corpus.sqlite (read-only at runtime) and
  app.sqlite (saved analyses and diagrams). Postgres is expected with accounts,
  not used yet. No IndexedDB/Dexie for saved work.

  Editing stays client-side with Zustand + Immer and SVG rendering; an edit
  never waits for a save. Saves go to the server. Until accounts exist, the
  app is single-user and local-only, with no public deployment.
  Python stdlib scripts in scripts/ingest/ emit versioned per-chapter corpus
  JSON under corpus/v1/; a TypeScript seed loads it into corpus.sqlite.
  Corpus chapter reads and attribution come from the server-side store.
  Word identity is always the MACULA id. Strip UBS ln/domain attributes.

  Styling: Tailwind v4, CSS custom-property tokens from DESIGN.md, and Radix
  UI primitives for the reader. Light, dark and sepia themes; serif-only type;
  part-of-speech colour always paired with a non-colour cue. The app supplies
  word facts, never automatic interpretation, segmentation or relationships.

  Tooling: npm with package-lock.json, Node pinned in .node-version, oxlint
  (no ESLint), Prettier, Vitest, Storybook 10 with Playwright browser tests
  and axe accessibility checks. Validation is one pure-TypeScript module
  shared by the editor, import path and server saves. Taxonomy and conjunction
  data live in docs/data/, with generated TypeScript types.

  Work isolation: implement every change in its own dedicated Git worktree
  and branch. Check git worktree list first. Never use or modify an existing
  worktree assigned to another person or agent, even if it is clean or named
  for the same change; create a uniquely named worktree and branch instead.
  Keep unrelated changes intact. Shared planning/configuration edits may be
  made in the main checkout when explicitly requested.

  Structural note: Bilateral is the one relationship with arity > 2. It is
  modelled as a single ternary node (before, supporter, after) so the
  proposition model stays a containment tree — see design.md decision 2 and
  docs/reference/model-notes.md.

  Canonical references: docs/reference/logical-relationships.md (the 18+4
  taxonomy) and docs/reference/model-notes.md (findings that constrain the
  data model). Read these before proposing changes to the taxonomy or
  proposition model.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Before implementation, create a dedicated Git worktree and branch
        for this change, or reuse one explicitly assigned to this session.
        Leave other agents' and users' worktrees untouched.
      - After each task that changes code, and before ticking it off, run two
        read-only reviewers in parallel on that task's diff, one for code
        review against the task, specs and CLAUDE.md constraints, one for
        security review. Claude uses Sonnet via its Agent tool; Codex uses
        native subagents with inherited model and reasoning defaults. Fix
        the findings you agree with, at most two review rounds per task, then
        run lint and tests.
